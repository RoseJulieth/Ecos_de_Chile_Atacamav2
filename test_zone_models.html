<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Modelos de Zonas</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            max-width: 300px;
            z-index: 100;
        }

        #info h3 {
            margin: 0 0 10px 0;
        }

        #info p {
            margin: 5px 0;
            font-size: 12px;
        }

        .success {
            color: #4CAF50;
        }

        .error {
            color: #f44336;
        }

        .warning {
            color: #ff9800;
        }
    </style>
</head>

<body>
    <div id="info">
        <h3>🧪 Test de Modelos de Zonas</h3>
        <p id="status">Cargando...</p>
        <div id="results"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuración de la escena
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 10, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 20, 10);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Suelo
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0xD2B48C });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid
        const gridHelper = new THREE.GridHelper(50, 50);
        scene.add(gridHelper);

        // Loader
        const loader = new GLTFLoader();
        const results = document.getElementById('results');
        const statusEl = document.getElementById('status');

        // Modelos a probar
        const modelsToTest = [
            { path: 'assets/models/terrain/Island.glb', name: 'Island', position: [-10, 0, 0], scale: 2.0 },
            { path: 'assets/models/terrain/Houses.glb', name: 'Houses', position: [0, 0, 0], scale: 3.5 },
            { path: 'assets/models/terrain/Storage_House.glb', name: 'Storage_House', position: [10, 0, 0], scale: 3.5 }
        ];

        let loadedCount = 0;
        let errorCount = 0;

        async function testModel(modelData) {
            return new Promise((resolve) => {
                const startTime = Date.now();

                loader.load(
                    modelData.path,
                    (gltf) => {
                        const loadTime = Date.now() - startTime;
                        const model = gltf.scene;

                        model.scale.set(modelData.scale, modelData.scale, modelData.scale);
                        model.position.set(modelData.position[0], modelData.position[1], modelData.position[2]);

                        model.traverse((child) => {
                            if (child.isMesh) {
                                child.castShadow = true;
                                child.receiveShadow = true;
                            }
                        });

                        scene.add(model);

                        const resultDiv = document.createElement('p');
                        resultDiv.className = 'success';
                        resultDiv.innerHTML = `✅ ${modelData.name}: OK (${loadTime}ms)`;
                        results.appendChild(resultDiv);

                        loadedCount++;
                        resolve(true);
                    },
                    (progress) => {
                        if (progress.total > 0) {
                            const percent = (progress.loaded / progress.total * 100).toFixed(0);
                            console.log(`${modelData.name}: ${percent}%`);
                        }
                    },
                    (error) => {
                        const resultDiv = document.createElement('p');
                        resultDiv.className = 'error';
                        resultDiv.innerHTML = `❌ ${modelData.name}: ERROR<br><small>${error.message}</small>`;
                        results.appendChild(resultDiv);

                        errorCount++;
                        resolve(false);
                    }
                );
            });
        }

        // Probar todos los modelos
        async function runTests() {
            statusEl.textContent = 'Probando modelos...';

            for (const model of modelsToTest) {
                await testModel(model);
            }

            statusEl.innerHTML = `
                <strong>Resultados:</strong><br>
                ✅ Cargados: ${loadedCount}<br>
                ❌ Errores: ${errorCount}<br>
                Total: ${modelsToTest.length}
            `;
        }

        runTests();

        // Animación
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
