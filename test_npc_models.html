<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Test - Modelos de NPCs</title>
    <style>
        body {
            margin: 0;
            background: #333;
            color: white;
            font-family: monospace;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 5px;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .model-test {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }

        .success {
            color: #4CAF50;
        }

        .error {
            color: #f44336;
        }

        .warning {
            color: #ff9800;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h3>🧪 Test - Modelos de NPCs</h3>
        <p>Probando carga de modelos GLB con texturas...</p>
        <div id="results"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuración
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 10, 5);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // Suelo
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xE4A056 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(20, 20);
        scene.add(gridHelper);

        // Modelos a probar
        const models = [
            { path: 'assets/models/npcs/Character.glb', name: 'Character', scale: 0.01 },
            { path: 'assets/models/npcs/Animated_Woman.glb', name: 'Animated Woman', scale: 0.01 }
        ];

        const loader = new GLTFLoader();
        const results = document.getElementById('results');
        let loadedModels = [];

        // Probar cada modelo
        async function testModels() {
            for (let i = 0; i < models.length; i++) {
                const modelData = models[i];
                const resultDiv = document.createElement('div');
                resultDiv.className = 'model-test';
                resultDiv.innerHTML = `<strong>${i + 1}. ${modelData.name}</strong><br>⏳ Cargando...`;
                results.appendChild(resultDiv);

                try {
                    const gltf = await loadModel(modelData.path);
                    const model = gltf.scene;

                    // Posicionar modelos lado a lado
                    model.position.set(i * 3 - 3, 0, 0);
                    model.scale.set(0.01, 0.01, 0.01);

                    // Analizar texturas
                    let textureCount = 0;
                    let meshCount = 0;
                    const textureInfo = [];

                    model.traverse((child) => {
                        if (child.isMesh) {
                            meshCount++;
                            child.castShadow = true;
                            child.receiveShadow = true;

                            if (child.material) {
                                if (child.material.map) {
                                    textureCount++;
                                    textureInfo.push({
                                        mesh: child.name,
                                        texture: child.material.map.image ? 'Sí' : 'No image'
                                    });
                                }
                            }
                        }
                    });

                    scene.add(model);
                    loadedModels.push(model);

                    resultDiv.innerHTML = `
                        <strong class="success">✅ ${modelData.name}</strong><br>
                        • Meshes: ${meshCount}<br>
                        • Texturas: ${textureCount}<br>
                        • Animaciones: ${gltf.animations.length}<br>
                        ${textureInfo.length > 0 ? `• Detalles: ${textureInfo.map(t => t.mesh).join(', ')}` : ''}
                    `;

                    console.log(`✅ ${modelData.name}:`, {
                        meshes: meshCount,
                        texturas: textureCount,
                        animaciones: gltf.animations.length,
                        detalles: textureInfo
                    });

                } catch (error) {
                    resultDiv.innerHTML = `
                        <strong class="error">❌ ${modelData.name}</strong><br>
                        Error: ${error.message}
                    `;
                    console.error(`❌ Error cargando ${modelData.name}:`, error);
                }
            }

            // Resumen
            const summary = document.createElement('div');
            summary.className = 'model-test';
            summary.style.marginTop = '20px';
            summary.style.borderTop = '2px solid #FFD700';
            summary.innerHTML = `
                <strong>📊 Resumen:</strong><br>
                • Modelos cargados: ${loadedModels.length}/${models.length}<br>
                • Estado: ${loadedModels.length === models.length ? '<span class="success">✅ Todos OK</span>' : '<span class="warning">⚠️ Algunos fallaron</span>'}
            `;
            results.appendChild(summary);
        }

        function loadModel(path) {
            return new Promise((resolve, reject) => {
                loader.load(
                    path,
                    (gltf) => resolve(gltf),
                    (progress) => {
                        const percent = (progress.loaded / progress.total * 100).toFixed(0);
                        console.log(`⏳ ${path}: ${percent}%`);
                    },
                    (error) => reject(error)
                );
            });
        }

        // Iniciar pruebas
        testModels();

        // Loop de animación
        function animate() {
            requestAnimationFrame(animate);

            // Rotar modelos
            loadedModels.forEach(model => {
                model.rotation.y += 0.005;
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Redimensionar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
