<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Test - Male Casual FBX</title>
    <style>
        body {
            margin: 0;
            background: #333;
            color: white;
            font-family: monospace;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 5px;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.9);
            padding: 15px;
            border-radius: 5px;
        }

        button {
            margin: 5px;
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #45a049;
        }

        button.active {
            background: #FF5722;
        }

        .anim-list {
            margin-top: 10px;
        }

        .anim-item {
            padding: 5px;
            margin: 3px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
        }

        .anim-item:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .anim-item.playing {
            background: #4CAF50;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h3>🧪 Test - Male Casual FBX</h3>
        <p id="status">Cargando...</p>
        <div id="details"></div>
        <div class="anim-list" id="animList"></div>
    </div>

    <div id="controls">
        <div><strong>Controles de Escala:</strong></div>
        <button onclick="changeScale(0.5)">Escala ÷2</button>
        <button onclick="changeScale(2)">Escala ×2</button>
        <button onclick="resetScale()">Reset</button>
        <br>
        <div style="margin-top: 10px;"><strong>Rotación:</strong></div>
        <button onclick="rotate(90)">↻ 90°</button>
        <button onclick="rotate(-90)">↺ -90°</button>
        <button onclick="rotate(180)">↻ 180°</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuración
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Controles de órbita
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 1, 0);

        // Iluminación mejorada
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 10, 5);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0xffffff, 0.5);
        fillLight.position.set(-5, 5, -5);
        scene.add(fillLight);

        // Luz puntual para el modelo
        const modelLight = new THREE.PointLight(0xffffff, 0.8, 20);
        modelLight.position.set(0, 3, 0);
        scene.add(modelLight);

        // Suelo
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xE4A056 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid y ejes
        const gridHelper = new THREE.GridHelper(20, 20);
        scene.add(gridHelper);

        const axesHelper = new THREE.AxesHelper(2);
        scene.add(axesHelper);

        // Variables globales
        let playerModel = null;
        let mixer = null;
        let currentAction = null;
        let animations = [];

        // Cargar modelo
        const loader = new FBXLoader();
        const status = document.getElementById('status');
        const details = document.getElementById('details');
        const animList = document.getElementById('animList');

        status.innerHTML = '⏳ Cargando Male_Casual.fbx...';

        loader.load(
            'assets/models/player/Male_Casual.fbx',
            (fbx) => {
                playerModel = fbx;
                animations = fbx.animations;

                // Configurar modelo
                playerModel.scale.set(0.01, 0.01, 0.01);
                playerModel.position.set(0, 0, 0);

                // Configurar materiales
                playerModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        if (child.material) {
                            child.material.side = THREE.DoubleSide;

                            // Mejorar visibilidad
                            if (child.material.emissive) {
                                child.material.emissive = new THREE.Color(0x333333);
                                child.material.emissiveIntensity = 0.3;
                            }

                            child.material.needsUpdate = true;
                        }
                    }
                });

                scene.add(playerModel);

                // Calcular bounding box
                const bbox = new THREE.Box3().setFromObject(playerModel);
                const size = new THREE.Vector3();
                bbox.getSize(size);

                // Información
                status.innerHTML = '✅ Modelo cargado exitosamente';
                details.innerHTML = `
                    <strong>📊 Información del Modelo:</strong><br>
                    • Escala: ${playerModel.scale.x.toFixed(3)}<br>
                    • Tamaño: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} unidades<br>
                    • Altura real: ${(size.y / playerModel.scale.y).toFixed(0)} unidades originales<br>
                    • Animaciones: ${animations.length}<br>
                    • Meshes: ${countMeshes(playerModel)}<br>
                    <br>
                    <strong>🎬 Animaciones Disponibles:</strong>
                `;

                // Configurar animaciones
                if (animations.length > 0) {
                    mixer = new THREE.AnimationMixer(playerModel);

                    animList.innerHTML = '<strong>Click para reproducir:</strong><br>';

                    animations.forEach((anim, i) => {
                        const div = document.createElement('div');
                        div.className = 'anim-item';
                        div.id = `anim-${i}`;
                        div.innerHTML = `${i + 1}. ${anim.name} (${anim.duration.toFixed(2)}s)`;
                        div.onclick = () => playAnimation(i);
                        animList.appendChild(div);

                        console.log(`Animación ${i + 1}: ${anim.name}`);
                    });

                    // Reproducir primera animación
                    playAnimation(0);
                } else {
                    animList.innerHTML = '<em>No se encontraron animaciones</em>';
                }

                // Centrar cámara
                camera.lookAt(0, size.y / 2, 0);
                controls.target.set(0, size.y / 2, 0);

                console.log('✅ Modelo cargado:', {
                    escala: playerModel.scale,
                    tamaño: size,
                    animaciones: animations.length
                });
            },
            (progress) => {
                const percent = (progress.loaded / progress.total * 100).toFixed(0);
                status.innerHTML = `⏳ Cargando: ${percent}%`;
            },
            (error) => {
                status.innerHTML = '❌ Error al cargar el modelo';
                details.innerHTML = `
                    <strong>Error:</strong><br>
                    ${error.message}<br><br>
                    <strong>Verifica:</strong><br>
                    • El archivo existe en assets/models/player/Male_Casual.fbx<br>
                    • El servidor está corriendo<br>
                    • La ruta es correcta
                `;
                console.error('Error:', error);
            }
        );

        // Funciones de control
        function playAnimation(index) {
            if (!mixer || !animations[index]) return;

            // Detener animación actual
            if (currentAction) {
                currentAction.fadeOut(0.3);
            }

            // Reproducir nueva animación
            currentAction = mixer.clipAction(animations[index]);
            currentAction.reset();
            currentAction.fadeIn(0.3);
            currentAction.play();

            // Actualizar UI
            document.querySelectorAll('.anim-item').forEach(el => el.classList.remove('playing'));
            document.getElementById(`anim-${index}`).classList.add('playing');

            console.log(`🎬 Reproduciendo: ${animations[index].name}`);
        }

        window.changeScale = (factor) => {
            if (playerModel) {
                playerModel.scale.multiplyScalar(factor);
                updateInfo();
            }
        };

        window.resetScale = () => {
            if (playerModel) {
                playerModel.scale.set(0.01, 0.01, 0.01);
                updateInfo();
            }
        };

        window.rotate = (degrees) => {
            if (playerModel) {
                playerModel.rotation.y += (degrees * Math.PI / 180);
            }
        };

        function countMeshes(obj) {
            let count = 0;
            obj.traverse((child) => {
                if (child.isMesh) count++;
            });
            return count;
        }

        function updateInfo() {
            if (playerModel) {
                const bbox = new THREE.Box3().setFromObject(playerModel);
                const size = new THREE.Vector3();
                bbox.getSize(size);

                console.log('Escala actualizada:', playerModel.scale.x.toFixed(3));
                console.log('Tamaño:', size);
            }
        }

        // Loop de animación
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Redimensionar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
