<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Test - Modelo del Jugador</title>
    <style>
        body {
            margin: 0;
            background: #333;
            color: white;
            font-family: monospace;
        }

        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 5px;
            max-width: 400px;
        }

        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 5px;
        }

        button {
            margin: 5px;
            padding: 8px 15px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="info">
        <h3>🧪 Test del Modelo del Jugador</h3>
        <p id="status">Cargando...</p>
        <div id="details"></div>
    </div>

    <div id="controls">
        <button onclick="changeScale(0.5)">Escala ÷2</button>
        <button onclick="changeScale(2)">Escala ×2</button>
        <button onclick="rotate()">Rotar 90°</button>
        <button onclick="toggleLight()">Toggle Luz</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Configuración
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(3, 2, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Controles de órbita
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Iluminación
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(5, 10, 5);
        sunLight.castShadow = true;
        scene.add(sunLight);

        let playerLight = new THREE.PointLight(0xffffff, 0.5, 10);
        playerLight.position.set(0, 2, 0);

        // Suelo
        const groundGeo = new THREE.PlaneGeometry(20, 20);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xE4A056 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Grid helper
        const gridHelper = new THREE.GridHelper(20, 20);
        scene.add(gridHelper);

        // Axes helper
        const axesHelper = new THREE.AxesHelper(2);
        scene.add(axesHelper);

        // Variables globales
        let playerModel = null;
        let mixer = null;

        // Cargar modelo
        const loader = new GLTFLoader();
        const status = document.getElementById('status');
        const details = document.getElementById('details');

        status.innerHTML = '⏳ Cargando player.glb...';

        loader.load(
            'assets/models/player/player.glb',
            (gltf) => {
                playerModel = gltf.scene;

                // Configurar modelo
                playerModel.scale.set(0.01, 0.01, 0.01);
                playerModel.position.set(0, 0, 0);

                // Configurar materiales
                playerModel.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;

                        if (child.material) {
                            child.material.side = THREE.DoubleSide;
                            if (child.material.emissive) {
                                child.material.emissive = new THREE.Color(0x222222);
                                child.material.emissiveIntensity = 0.2;
                            }
                        }
                    }
                });

                // Agregar luz al modelo
                playerModel.add(playerLight);

                scene.add(playerModel);

                // Calcular bounding box
                const bbox = new THREE.Box3().setFromObject(playerModel);
                const size = new THREE.Vector3();
                bbox.getSize(size);

                // Información
                status.innerHTML = '✅ Modelo cargado exitosamente';
                details.innerHTML = `
                    <strong>Información del Modelo:</strong><br>
                    • Escala: ${playerModel.scale.x.toFixed(3)}<br>
                    • Tamaño: ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)}<br>
                    • Animaciones: ${gltf.animations.length}<br>
                    • Meshes: ${countMeshes(playerModel)}<br>
                    <br>
                    <strong>Animaciones:</strong><br>
                    ${gltf.animations.map((a, i) => `${i + 1}. ${a.name}`).join('<br>') || 'Ninguna'}
                    <br><br>
                    <strong>Controles:</strong><br>
                    • Click + Arrastrar: Rotar<br>
                    • Scroll: Zoom<br>
                    • Botones: Ajustes rápidos
                `;

                // Configurar animaciones
                if (gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(playerModel);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }

                // Centrar cámara
                camera.lookAt(playerModel.position);
            },
            (progress) => {
                const percent = (progress.loaded / progress.total * 100).toFixed(0);
                status.innerHTML = `⏳ Cargando: ${percent}%`;
            },
            (error) => {
                status.innerHTML = '❌ Error al cargar el modelo';
                details.innerHTML = `
                    <strong>Error:</strong><br>
                    ${error.message}<br><br>
                    <strong>Verifica:</strong><br>
                    • El archivo existe en assets/models/player/player.glb<br>
                    • El servidor está corriendo<br>
                    • La ruta es correcta
                `;
                console.error('Error:', error);
            }
        );

        // Funciones de control
        window.changeScale = (factor) => {
            if (playerModel) {
                playerModel.scale.multiplyScalar(factor);
                updateInfo();
            }
        };

        window.rotate = () => {
            if (playerModel) {
                playerModel.rotation.y += Math.PI / 2;
            }
        };

        window.toggleLight = () => {
            playerLight.visible = !playerLight.visible;
        };

        function countMeshes(obj) {
            let count = 0;
            obj.traverse((child) => {
                if (child.isMesh) count++;
            });
            return count;
        }

        function updateInfo() {
            if (playerModel) {
                const bbox = new THREE.Box3().setFromObject(playerModel);
                const size = new THREE.Vector3();
                bbox.getSize(size);

                const scaleInfo = document.querySelector('#details strong:first-child + br + br');
                if (scaleInfo) {
                    scaleInfo.textContent = `• Escala: ${playerModel.scale.x.toFixed(3)}`;
                }
            }
        }

        // Loop de animación
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Redimensionar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
